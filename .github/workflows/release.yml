name: Release (Windows build)

# Builds the desktop app on a clean machine.
#  - Run it by hand (Actions -> Release -> Run workflow) to get the exe + installers as a downloadable artifact.
#  - Push a tag like v0.2.0 to also publish them on a GitHub Release.
# The binaries are NOT code-signed, so Windows SmartScreen will warn on first run ("More info" -> "Run anyway").

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build desktop app
        run: npm run tauri build
      - name: Collect files
        shell: bash
        run: |
          mkdir dist-release
          cp src-tauri/target/release/zeropulse-swarm.exe dist-release/
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/ || true
          cp src-tauri/target/release/bundle/msi/*.msi dist-release/ || true
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: zeropulse-swarm-windows
          path: dist-release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist-release/* \
            --title "ZeroPulse Swarm ${{ github.ref_name }}" \
            --notes "Unsigned Windows build. SmartScreen will warn on first run: choose More info, then Run anyway. See README.md for setup."
